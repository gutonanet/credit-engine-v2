spring:
  application:
    name: credit-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/credit_engine}
    username: ${SPRING_DATASOURCE_USERNAME:credit}
    password: ${SPRING_DATASOURCE_PASSWORD:credit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.creditengine: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      fx:
        sliding-window-type: count_based
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
  retry:
    instances:
      fx:
        max-attempts: 2
        wait-duration: 50ms
        retry-exceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
  timelimiter:
    instances:
      fx:
        timeout-duration: 1s
        cancel-running-future: true
